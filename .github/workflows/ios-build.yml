name: iOS compile check

on:
  workflow_dispatch:
    inputs:
      sign_ipa:
        description: Export an Ad Hoc IPA for registered iPhones
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Prepare dependencies
        working-directory: source/Example/ESPProvisionSample
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          command -v pod >/dev/null || brew install cocoapods
          pod --version
          # Build the library checked out from this repository, rather than a published copy.
          ruby <<'RUBY'
          file = 'Podfile'
          text = File.read(file)
          unless text.sub!(/^\s*pod 'ESPProvision', '3\.0\.3'/, "  pod 'ESPProvision', :path => '../..'")
            abort 'Unexpected Podfile: review local ESPProvision dependency before building'
          end
          text.gsub!("['ENABLE_BITCODE'] = 'YES'", "['ENABLE_BITCODE'] = 'NO'")
          File.write(file, text)
          RUBY
          pod install

      - name: Compile unsigned iPhone app
        if: ${{ !inputs.sign_ipa }}
        working-directory: source/Example/ESPProvisionSample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/results"
          xcodebuild \
            -workspace ESPProvisionSample.xcworkspace \
            -scheme ESPProvisionSample \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            PRODUCT_BUNDLE_IDENTIFIER=com.grassy1120.voltdeer.provision \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/results/xcodebuild.log"

      - name: Package unsigned IPA for personal signing
        if: ${{ !inputs.sign_ipa }}
        shell: bash
        run: |
          set -euo pipefail
          app_dir="$RUNNER_TEMP/ios-derived-data/Build/Products/Debug-iphoneos"
          staging="$RUNNER_TEMP/unsigned-ipa"
          mkdir -p "$staging/Payload"
          apps=("$app_dir"/*.app)
          test "${#apps[@]}" -eq 1
          test -d "${apps[0]}"
          ditto "${apps[0]}" "$staging/Payload/$(basename "${apps[0]}")"
          cd "$staging"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/results/Voltdeer-personal-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/results/Voltdeer-personal-unsigned.ipa"

      - name: Save unsigned IPA
        if: ${{ !inputs.sign_ipa }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-personal-unsigned
          path: results/Voltdeer-personal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Archive and sign for registered devices
        if: inputs.sign_ipa
        working-directory: source/Example/ESPProvisionSample
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IPA_PASSWORD: ${{ secrets.IOS_IPA_PASSWORD }}
        run: bash ../../.github/scripts/sign-adhoc.sh

      - name: Save encrypted IPA
        if: inputs.sign_ipa
        uses: actions/upload-artifact@v7
        with:
          name: ios-adhoc
          path: ${{ runner.temp }}/Voltdeer-iOS.7z
          if-no-files-found: error
          retention-days: 3

      - name: Save build logs
        if: always() && !inputs.sign_ipa
        uses: actions/upload-artifact@v7
        with:
          name: ios-compile-logs
          path: results/
          if-no-files-found: ignore
          retention-days: 7
